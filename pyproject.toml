
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitlang"
version = "0.1.0"
description = "A simple programming language made in Python"
authors = [
    { name = "amirali" }
]
requires-python = ">=3.10"

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
include = ["orbit", "orbit.*"]
